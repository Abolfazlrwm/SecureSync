name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests

  format:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: black --check src tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        # bash instead of the runner default (PowerShell on Windows).
        shell: bash
        run: pytest --cov-report=xml
      # A coverage.xml that measures nothing (all 0%) has happened here
      # before: a non-editable install shadows the checked-out source.
      # Fail loudly instead of uploading a meaningless report.
      - name: Assert coverage was actually measured
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate", "0"))
          print(f"coverage line-rate = {rate:.4f}")
          if rate <= 0.0:
              sys.exit(
                  "coverage.xml reports 0% — the tests are not importing the "
                  "checked-out source, so the uploaded report is meaningless"
              )
          PY
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security-tests:
    name: Security test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # No "no tests collected" escape hatch here: an empty security
      # suite must fail, not pass.
      - name: Run security test suite
        run: pytest tests/security -v

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit
      # Audits the resolved environment, so the dev extras are covered
      # too — contributors run the same set of packages CI does.
      # --strict also fails on audit errors instead of skipping them.
      - name: Audit installed dependencies
        run: pip-audit --strict
