name: Release

# Runs once per tag. The tag must match the version in pyproject.toml
# (v1.6.0 shipped once with the two out of sync — this check makes
# that impossible to repeat silently).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # upload distributions to the release
  packages: write   # push the image to GHCR

concurrency:
  group: release-${{ github.ref }}
  # Publishing must not be killed mid-upload by a newer tag push.
  cancel-in-progress: false

jobs:
  check-tag:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag against pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag v$TAG_VERSION, pyproject.toml $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION — fix one of them and re-tag"
            exit 1
          fi

  build:
    name: Build, verify and attach distributions
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import pathlib
          import securesync
          import securesync.main

          pkg = pathlib.Path(securesync.__file__).parent
          assert (pkg / "py.typed").is_file(), "py.typed missing from the wheel"
          print("import + py.typed OK")
          PY
          /tmp/smoke/bin/securesync --help > /dev/null
          echo "CLI entry point OK"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -b *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  docker:
    name: Docker image (GHCR)
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$IMAGE:${GITHUB_REF_NAME#v}" --tag "$IMAGE:latest" .

      - name: Push the image
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"
