name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests

  format:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: black --check src tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        # GitHub's Windows runners default `run:` steps to PowerShell,
        # not bash -- this script's `if [ "$code" -eq 5 ]` syntax is
        # bash-only and silently failed with a ParserError on every
        # windows-latest run until this was added (never caught before
        # because this workflow had never actually been run on a real
        # GitHub-hosted Windows runner).
        shell: bash
        run: |
          set +e
          pytest --cov-report=xml
          code=$?
          # Exit code 5 = "no tests collected". Expected before Phase 1
          # lands any tests; treat as a pass so scaffolding-only PRs stay
          # green. Any other non-zero code is a real failure.
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests collected yet (expected pre-Phase 1) — not a failure."
            exit 0
          fi
          exit $code
      # Guard against the report silently measuring nothing. This job used to
      # print "TOTAL 1917 1917 0%" and upload a 0% coverage.xml to Codecov,
      # because `pip install .` (non-editable) put a second copy of the
      # package in site-packages that the tests actually imported, while
      # coverage measured src/securesync. That is fixed by the editable
      # install above plus `pythonpath = ["src", "."]`, and this step makes
      # any regression fail loudly instead of shipping a green 0%.
      - name: Assert coverage was actually measured
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate", "0"))
          print(f"coverage line-rate = {rate:.4f}")
          if rate <= 0.0:
              sys.exit(
                  "coverage.xml reports 0% — the tests are not importing the "
                  "checked-out source, so the uploaded report is meaningless"
              )
          PY
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security-tests:
    name: Security test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # No exit-code-5 escape hatch here, deliberately.
      #
      # pytest exits 5 when it collects no tests. This job previously
      # translated that into success, so it reported a green "Security
      # test suite" while tests/security/ was completely empty -- the
      # job proved nothing at all, and the green checkmark actively
      # suggested otherwise. For this job an empty suite is a failure,
      # not a pass: it exists solely to prove the attacks in
      # tests/security are actually exercised.
      - name: Run security test suite
        run: pytest tests/security -v
