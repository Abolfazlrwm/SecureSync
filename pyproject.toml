[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securesync"
version = "1.6.1"
description = "Encrypted peer-to-peer file synchronization engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Abolfazl Ranjbaran", email = "206173650+Abolfazlrwm@users.noreply.github.com" }
]
keywords = [
    "file-sync",
    "peer-to-peer",
    "encryption",
    "distributed-systems",
    "end-to-end-encryption",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Security :: Cryptography",
]

# Rationale for every entry: docs/architecture.md "Technology Decisions".
dependencies = [
    "watchdog>=4.0",        # Cross-platform filesystem event monitoring
    "cryptography>=42.0",   # X25519, AES-256-GCM, ChaCha20-Poly1305 (audited, industry standard)
    "msgpack>=1.0",         # Compact binary payload encoding for the wire protocol
    "orjson>=3.10",         # Fast JSON for config/CLI-facing data, not the wire protocol
    "typer>=0.12",          # CLI framework (built on Click, type-hint driven)
    "rich>=13.7",           # Terminal rendering for the live dashboard
    "pyyaml>=6.0",          # YAML configuration files
    "structlog>=24.1",      # Structured logging
    "aiosqlite>=0.20",      # Async SQLite for metadata persistence
    "zeroconf>=0.131",      # mDNS peer discovery on local networks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",     # Property-based tests for the chunk engine
    "mypy>=1.10",
    "types-PyYAML>=6.0",     # mypy --strict fails without it
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]

[project.scripts]
securesync = "securesync.presentation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/securesync"]

# --- Tooling configuration ------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" keeps the tests importing the checked-out package instead of a
# site-packages copy, and "--cov=." (not "--cov=src/securesync") keeps
# coverage.xml paths repo-relative so Codecov can map them.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
# Root-relative so coverage.xml lists src/securesync/... paths Codecov
# can map back to this repository.
source = ["."]
omit = [
    "tests/*",
    "benchmarks/*",
    "scripts/*",
    "examples/*",
    ".venv/*",
]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
