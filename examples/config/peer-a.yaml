# Example configuration — Peer A
# Schema documented in docs/configuration.md
# Used by docker-compose.yml's securesync-a service.

profile: "production"

device_id: null  # null/omitted: a fresh UUID is generated on first run

storage:
  sync_directory: "/home/securesync/data"
  database_path: "/home/securesync/metadata.db"
  chunk_repository_path: "/home/securesync/chunks"
  chunk_size: 4194304  # 4 MiB

network:
  port: 22000              # handshake server
  transfer_port: 22002     # encrypted chunk transfer
  manifest_port: 22003     # manifest exchange
  discovery_enabled: true
  mDNS_service_type: "_securesync._tcp.local."

log_level: "INFO"
